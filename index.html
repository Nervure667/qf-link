<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ouvrir Quantfury</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px 18px; background: #0d1117; color: #e6edf3; font: 16px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: #9da7b3; margin: 6px 0 18px; }
  a.btn { display: block; padding: 14px 16px; margin: 10px 0; border-radius: 12px; background: #1f6feb; color: #fff; text-decoration: none; font-weight: 600; text-align: center; }
  a.alt { background: #21262d; font-weight: 500; text-align: left; font-family: ui-monospace, monospace; font-size: 14px; }
  .sym { font-size: 34px; font-weight: 700; text-align: center; margin: 18px 0 4px; }
  .hint { font-size: 13px; text-align: center; }
</style>
</head>
<body>
<main id="app"></main>
<script>
  var FORMATS = ["instrument", "trade", "symbol", "asset", "instruments", "markets"];
  var q = new URLSearchParams(location.search);
  var app = document.getElementById("app");
  var sym = (q.get("s") || "").replace(/[^A-Za-z0-9._!\/-]/g, "").slice(0, 24);
  var fmt = FORMATS.indexOf(q.get("f")) >= 0 ? q.get("f") : "instrument";

  function link(href, text, cls) {
    var a = document.createElement("a");
    a.href = href; a.textContent = text; a.className = "btn " + (cls || "");
    return a;
  }

  if (sym) {
    var target = "quantfury://" + fmt + "/" + encodeURIComponent(sym);
    app.innerHTML = '<h1>Ouvrir Quantfury</h1><div class="sym"></div><p class="hint">Si rien ne s\'ouvre, touche le bouton, puis cherche ce ticker dans l\'app.</p>';
    app.querySelector(".sym").textContent = sym;
    app.appendChild(link(target, "Ouvrir dans Quantfury"));
    setTimeout(function () { location.href = target; }, 150);
  } else {
    var OL = "https://quantfury.onelink.me/";
    var TEMPLATES = "0ddr mR4D A5Ls GDFi 3KPP zPhZ tJue 2lYm XjO4 jVI7 yhSw NNaK czWO dbXI n5K0 3r8P o1RE F9Yy yYzQ tUZN ASDv 3T2k TCnv oZVk qev9 Ai85".split(" ");
    var PARAMS = [
      "deep_link_value=AAPL",
      "deep_link_value=instrument&deep_link_sub1=AAPL",
      "deep_link_value=trade&deep_link_sub1=AAPL",
      "deep_link_value=symbol&deep_link_sub1=AAPL",
      "deep_link_value=AAPL&deep_link_sub1=AAPL"
    ];
    app.innerHTML = '<h1>Liens Quantfury</h1><p>Touche chaque bouton. Note ceux qui ouvrent l’app, et l’écran affiché.</p><h1 style="font-size:17px;margin-top:22px">A. Paramètres (modèle 0ddr)</h1>';
    PARAMS.forEach(function (q) { app.appendChild(link(OL + "0ddr/test?" + q, q, "alt")); });
    var h = document.createElement("h1");
    h.style.fontSize = "17px"; h.style.marginTop = "22px";
    h.textContent = "B. Les 26 modèles (sans paramètre)";
    app.appendChild(h);
    TEMPLATES.forEach(function (t) { app.appendChild(link(OL + t + "/test", "/" + t + "/test", "alt")); });
  }
</script>
</body>
</html>
